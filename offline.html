<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — OmniDoc Studio</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F8FAFC;color:#0F172A;padding:24px}
    .card{max-width:440px;background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:28px;text-align:center;box-shadow:0 10px 30px rgba(15,23,42,.08)}
    h1{margin:0 0 8px;font-size:20px}p{color:#475569;font-size:14px;line-height:1.5}
    button{margin-top:14px;padding:10px 18px;border:none;border-radius:8px;background:#2563EB;color:#fff;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h1>You are Offline</h1>
    <p>OmniDoc Studio works offline once opened once while connected. Reconnect briefly to sync libraries, or retry now.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
